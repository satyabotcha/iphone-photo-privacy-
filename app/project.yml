name: LockedPhotos
options:
  bundleIdPrefix: com.satyabotcha
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: B36HAV7Z5C
targets:
  LockedPhotos:
    type: application
    platform: iOS
    sources:
      - path: LockedPhotos
        excludes:
          - Assets.xcassets
      - path: LockedPhotos/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satyabotcha.LockedPhotos
        INFOPLIST_FILE: LockedPhotos/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: LockedPhotosShareExtension
        embed: true
      - target: LockedPhotosActionExtension
        embed: true
  LockedPhotosShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LockedPhotosShareExtension
      - path: LockedPhotos/SelectedPhoto.swift
      - path: LockedPhotos/HandoffViewer.swift
      - path: LockedPhotos/ZoomableImage.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satyabotcha.LockedPhotos.ShareExtension
        INFOPLIST_FILE: LockedPhotosShareExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
  LockedPhotosActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LockedPhotosShareExtension/ShareExtensionRootView.swift
      - path: LockedPhotosShareExtension/ShareViewController.swift
      - path: LockedPhotosShareExtension/SharedPhotoLoader.swift
      - path: LockedPhotos/SelectedPhoto.swift
      - path: LockedPhotos/HandoffViewer.swift
      - path: LockedPhotos/ZoomableImage.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satyabotcha.LockedPhotos.ActionExtension
        INFOPLIST_FILE: LockedPhotosActionExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
  LockedPhotosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LockedPhotosUITests
    dependencies:
      - target: LockedPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satyabotcha.LockedPhotosUITests
        INFOPLIST_FILE: LockedPhotosUITests/Info.plist
